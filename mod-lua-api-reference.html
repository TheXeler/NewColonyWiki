<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua API 速查 · NewColony Wiki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="mod-lua-api-reference">
<div class="main">
  <div class="topbar"><div class="breadcrumb"><a href="index.html">Wiki</a><span class="sep">/</span>Lua API 速查</div></div>
  <div class="content">
    <h1>Lua API 速查</h1>
    <p class="subtitle">按当前引擎绑定整理的函数表。用搜索框过滤模块、函数名、参数或说明。</p>

    <div class="callout warn">
      <code>math.random</code> 在脚本环境中会报错。需要确定性随机时，请使用 <code>engine.random</code>。<br>在 MOD 脚本中加载额外文件请使用 <code>dofile</code> 而非 <code>require</code>——<code>package</code> 库未在 MOD 沙箱中加载。
    </div>

    <div class="search-box">
      <input data-api-search type="search" placeholder="搜索 API，例如 focus、inventory、spawn、terrain、locale">
    </div>

    <div data-lua-api-container>
      <p><em>正在加载 API 列表…</em></p>
    </div>

    <p data-api-empty hidden>没有匹配的 API。换一个关键词试试。</p>

    <div class="footer">NewColony Wiki · UTF-8</div>
  </div>
</div>
<script src="lua-api-data.js"></script>
<script src="wiki.js"></script>
</body>
